[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-agent"
version = "1.0.0"
description = "A coding agent powered by LangGraph — supports Anthropic and OpenAI backends"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "pymilvus>=2.6,<2.7",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=5,<6", "transformers>=4.41,<5"]

[project.scripts]
claude-code-agent = "claude_code_agent.__main__:main"

[tool.setuptools.package-dir]
claude_code_agent = "src"
