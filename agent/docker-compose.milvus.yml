name: claude-agent-memory

services:
  milvus:
    image: milvusdb/milvus:v2.6.0
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: 'true'
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      MQ_TYPE: rocksmq
    volumes:
      - milvus-data:/var/lib/milvus
      - ./deploy/milvus-embedded-etcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    ports:
      - '127.0.0.1:19530:19530'
      - '127.0.0.1:9091:9091'
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 18

volumes:
  milvus-data:
