version: "3.9"

services:
  backend:
    build: .
    expose: ["2024"]               # 只对内，nginx 做负载均衡
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - MYSQL_HOST=mysql
      - ENVIRONMENT=production
    depends_on: [redis, mysql]
    restart: unless-stopped
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./uploads:/app/uploads
    # 扩容：docker-compose up --scale backend=3

  frontend:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./front/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: content_builder_agent
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  redis_data:
  mysql_data:
